name: Promemoria scadenze

on:
  schedule:
    - cron: '23 5 * * *'   # ogni mattina, verso le 7 ora italiana
  workflow_dispatch:
    inputs:
      prova:
        description: 'Invio di prova: manda subito tutte le scadenze aperte'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Invia i promemoria del giorno
        run: node scripts/promemoria.mjs
        env:
          PROMEMORIA_EMAIL: ${{ secrets.PROMEMORIA_EMAIL }}
          PROMEMORIA_PASSWORD: ${{ secrets.PROMEMORIA_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PROMEMORIA_FORZA: ${{ inputs.prova }}
